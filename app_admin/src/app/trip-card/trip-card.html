<!--
  Trip Card Component Template

  Responsible for rendering a single Trip record
  as a Bootstrap card.

  Displays:
  - Trip name (header)
  - Thumbnail image
  - Resort location
  - Length and pricing information
  - Description
  - Edit button (delegates to parent workflow)
-->

<div class="card">

  <!-- =======================
       Card Header (Trip Name)
       ======================= -->
  <div class="card-header">
    {{ trip.name }}
  </div>

  <!-- =======================
       Trip Image
       ======================= -->
  <img
    src="assets/images/{{ trip.image }}"
    alt="trip thumbnail"
    class="card-img-top"
  />

  <!-- =======================
       Card Body
       ======================= -->
  <div class="card-body">

    <!-- Resort Location -->
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <!-- Length & Price Information -->
    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only
      {{ trip.perPerson | currency:'USD':'symbol' }}
    </p>

    <!-- Description (Rendered as HTML) -->
    <p class="card-text"
       [innerHTML]="trip.description">
    </p>

    <!-- Edit Button -->
    <div>
      <button
        (click)="editTrip(trip)"
        class="btn btn-info">
        Edit Trip
      </button>
    </div>

  </div>
</div>
