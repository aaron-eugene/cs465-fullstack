<div class="col-md-4">
  <h2 class="text-center">Edit Trip</h2>

  <form *ngIf="editForm"
        [formGroup]="editForm"
        (ngSubmit)="onSubmit()">

    <!-- Code -->
    <div class="form-group mb-3">
      <label>Code:</label>
      <input type="text"
             formControlName="code"
             placeholder="Code"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">

      <div *ngIf="submitted && f['code'].errors">
        <div *ngIf="f['code'].errors && f['code'].errors['required']" class="text-danger">
          Trip Code is required
        </div>
      </div>
    </div>

    <!-- Name -->
    <div class="form-group mb-3">
      <label>Name:</label>
      <input type="text"
             formControlName="name"
             placeholder="Name"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">

      <div *ngIf="submitted && f['name'].errors">
        <div *ngIf="f['name'].errors && f['name'].errors['required']" class="text-danger">
          Name is required
        </div>
      </div>
    </div>

    <!-- Length -->
    <div class="form-group mb-3">
      <label>Length:</label>
      <input type="text"
             formControlName="length"
             placeholder="Length"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">

      <div *ngIf="submitted && f['length'].errors">
        <div *ngIf="f['length'].errors && f['length'].errors['required']" class="text-danger">
          Length is required
        </div>
      </div>
    </div>

    <!-- Start -->
    <div class="form-group mb-3">
      <label>Start Date:</label>
      <input type="date"
             formControlName="start"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">

      <div *ngIf="submitted && f['start'].errors">
        <div *ngIf="f['start'].errors && f['start'].errors['required']" class="text-danger">
          Date is required
        </div>
      </div>
    </div>

    <!-- Resort -->
    <div class="form-group mb-3">
      <label>Resort:</label>
      <input type="text"
             formControlName="resort"
             placeholder="Resort"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">

      <div *ngIf="submitted && f['resort'].errors">
        <div *ngIf="f['resort'].errors && f['resort'].errors['required']" class="text-danger">
          Resort is required
        </div>
      </div>
    </div>

    <!-- Per Person -->
    <div class="form-group mb-3">
      <label>Per Person:</label>
      <input type="text"
             formControlName="perPerson"
             placeholder="Price per person"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">

      <div *ngIf="submitted && f['perPerson'].errors">
        <div *ngIf="f['perPerson'].errors && f['perPerson'].errors['required']" class="text-danger">
          Per Person price is required
        </div>
      </div>
    </div>

    <!-- Image -->
    <div class="form-group mb-3">
      <label>Image Name:</label>
      <input type="text"
             formControlName="image"
             placeholder="Image file name"
             class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">

      <div *ngIf="submitted && f['image'].errors">
        <div *ngIf="f['image'].errors && f['image'].errors['required']" class="text-danger">
          Image name is required
        </div>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group mb-4">
      <label>Description:</label>
      <textarea formControlName="description"
                rows="4"
                class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f['description'].errors }">
      </textarea>

      <div *ngIf="submitted && f['description'].errors">
        <div *ngIf="f['description'].errors && f['description'].errors['required']" class="text-danger">
          Description is required
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-info w-100">
      Save
    </button>

  </form>
</div>
